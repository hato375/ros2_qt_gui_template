name: Linux ROS 2 CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-ros2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Ubuntu 22.04 / ROS 2 Humble
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Set up ROS 2
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Build and run tests
        id: ros_ci
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          target-ros2-distro: humble
          coverage-result: false

      - name: Upload colcon logs
        if: ${{ always() && steps.ros_ci.outputs.ros-workspace-directory-name != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: colcon-logs
          path: ${{ steps.ros_ci.outputs.ros-workspace-directory-name }}/log
          if-no-files-found: warn
          retention-days: 14
