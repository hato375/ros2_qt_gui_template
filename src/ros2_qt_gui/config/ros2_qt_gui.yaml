ros2_qt_gui_node:
  ros__parameters:
    heartbeat_interval_ms: 1000
    gui_status_check_interval_ms: 200
    component_monitor_names:
      - camera
      - plc
    component_monitors:
      camera:
        enabled: true
        display_name: Camera
        status_topic: camera/status
        timeout_ms: 3000
      plc:
        enabled: true
        display_name: PLC
        status_topic: plc/status
        timeout_ms: 5000
