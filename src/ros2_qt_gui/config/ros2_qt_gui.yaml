ros2_qt_gui_node:
  ros__parameters:
    heartbeat_interval_ms: 1000
    gui_status_check_interval_ms: 200
    topic_monitor_names:
      - camera
      - plc
    topic_monitors:
      camera:
        enabled: true
        topic_name: camera/status
        timeout_ms: 3000
      plc:
        enabled: true
        topic_name: plc/status
        timeout_ms: 5000
