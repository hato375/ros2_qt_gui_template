ros2_qt_gui_node:
  ros__parameters:
    heartbeat_interval_ms: 1000
    gui_status_check_interval_ms: 200
    component_monitor_names:
      - sample_processor
    component_monitors:
      sample_processor:
        enabled: true
        display_name: Sample processor
        status_topic: sample_processor/status
        expected_component_id: sample-processor-1
        timeout_ms: 3000
        maximum_status_age_ms: 0
        maximum_future_skew_ms: 0
